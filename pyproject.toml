[project]
name = "myvllm"
version = "0.1.0"
description = "A custom vLLM project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "transformers",
    "torch",
    "xxhash",
    # vllm has no Windows build; keep it on the other platforms so the
    # three-way comparison in benchmark_tps.py still works out of the box.
    "vllm>=0.15.0; sys_platform != 'win32'",
    "triton; sys_platform != 'win32'",
    "triton-windows>=3.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
]

# Windows 上 PyPI 默认 torch 是 CPU 版；固定走 PyTorch 官方 cu128 源（含 sm_120/Blackwell）
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
